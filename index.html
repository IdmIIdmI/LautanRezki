let score=0,found=new Set(),level=1,distance=1,target=null,z=0,ready=false,pull=false,shot=false,rope=0;

// AUDIO: buih air dan pernafasan penyelam yang lebih jelas (WebAudio, tanpa fail luar)
let soundOn=true,audioCtx=null,ambienceTimer=null,voiceBusy=false,noiseBuffer=null;
function initAudio(){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();if(!noiseBuffer&&audioCtx){noiseBuffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);let d=noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.8;}if(!ambienceTimer)ambienceTimer=setInterval(()=>{if(soundOn&&!voiceBusy&&audioCtx&&audioCtx.state==='running'){bubbleSound();if(Math.random()<.58)setTimeout(diverBreath,350+Math.random()*450)}},1500)}catch(e){}}
function tone(freq,dur,type='sine',vol=.12,slide=0){if(!soundOn)return;initAudio();if(!audioCtx)return;try{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),audioCtx.currentTime+dur);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(vol,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02)}catch(e){}}
function noiseBurst(dur,vol,filterType,frequency,q=1){if(!soundOn)return;initAudio();if(!audioCtx||!noiseBuffer)return;try{let src=audioCtx.createBufferSource();src.buffer=noiseBuffer;src.loop=true;let f=audioCtx.createBiquadFilter();f.type=filterType;f.frequency.value=frequency;f.Q.value=q;let g=audioCtx.createGain(),now=audioCtx.currentTime;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+Math.min(.08,dur*.25));g.gain.exponentialRampToValueAtTime(.0001,now+dur);src.connect(f);f.connect(g);g.connect(audioCtx.destination);src.start(now);src.stop(now+dur+.03)}catch(e){}}
function bubbleSound(){if(!soundOn)return;initAudio();// bunyi gelembung: beberapa "blup" pendek dengan turun naik pitch + pop berair
let n=2+Math.floor(Math.random()*3);for(let i=0;i<n;i++){let delay=i*110;setTimeout(()=>{if(!soundOn)return;let f=260+Math.random()*260; tone(f,.20,'sine',.10,-f*.55);tone(f*1.65,.09,'sine',.035,-f*.5);noiseBurst(.055,.025,'lowpass',900+Math.random()*500,1.2)},delay)}}
function diverBreath(){if(!soundOn)return;initAudio();// sedutan regulator: hiss berfilter, kemudian gelembung ekzos
noiseBurst(.62,.075,'bandpass',650,1.3);tone(78,.52,'triangle',.055,-18);setTimeout(()=>{noiseBurst(.34,.06,'lowpass',420,1);tone(115,.3,'sine',.06,-55);bubbleSound()},650)}
function shootSound(){tone(180,.16,'sawtooth',.09,-100);setTimeout(()=>tone(720,.08,'triangle',.06,-400),80)}
function hitSound(){tone(260,.1,'triangle',.08,-100);setTimeout(()=>tone(110,.22,'sine',.08,-40),90)}
function pullSound(){tone(320,.12,'triangle',.06,-100);setTimeout(()=>tone(420,.12,'sine',.045,-130),140)}
function successSound(){tone(660,.15,'sine',.1,100);setTimeout(()=>tone(880,.18,'sine',.1,80),140);setTimeout(()=>tone(1100,.28,'sine',.09,120),300)}

function aim(dir){
 if(shot){toast("Sasaran sudah dikunci!");return}
 aimX=Math.max(-1,Math.min(1,aimX+dir*.18));

function shoot(){

 const cx=W*.5,cy=H*.42;flight={x:cx,y:H*.72,tx:cx+aimX*W*.2,ty:cy,progress:0,speed:.018+power*.00035};

}

const sb=document.getElementById('shootBtn');sb.addEventListener('contextmenu',e=>e.preventDefault());sb.addEventListener('copy',e=>e.preventDefault());sb.addEventListener('pointerdown',holdStart);sb.addEventListener('pointerup',holdEnd);sb.addEventListener('pointercancel',holdEnd);sb.addEventListener('pointerleave',e=>{if(powerDown&&e.buttons===0)holdEnd(e)});
function joyInput(e){const r=joyWrap.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.38;let len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len}joyKnob.style.transform=`translate(${dx}px,${dy}px)`;aimX=Math.max(-1,Math.min(1,dx/max));viewX+=dx/max*.035;viewY+=dy/max*.035;viewY=Math.max(-.45,Math.min(.45,viewY));}
const joyWrap=document.getElementById('joyWrap'),joyKnob=document.getElementById('joyKnob');let joyOn=false;joyWrap.addEventListener('pointerdown',e=>{joyOn=true;joyWrap.setPointerCapture(e.pointerId);joyInput(e)});joyWrap.addEventListener('pointermove',e=>{if(joyOn)joyInput(e)});joyWrap.addEventListener('pointerup',()=>{joyOn=false;joyKnob.style.transform='translate(0,0)'});joyWrap.addEventListener('pointercancel',()=>{joyOn=false;joyKnob.style.transform='translate(0,0)'});

function pullStart(){
 if(!shot||!target){toast("Tunggu panah sampai sasaran dahulu!");return}
 if(ready){toast("Tali sudah ditarik—terus baca zikir!");return}
 pull=true;ready=true;initAudio();pullSound();
 document.getElementById('zikbtn').disabled=false;
 document.getElementById('pullhint').textContent='Baca Subhanallah — tali bergerak';
 toast("TALI DITARIK! Baca Subhanallah 20 kali");
}
let recog=null,listening=false,lastPhraseAt=0,micStarting=false,micStream=null,micEnabled=false;
async function startListening(){
 if(!ready||z>=20)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('Pengecaman suara tidak disokong. Buka game dalam Google Chrome.');return}
 if(listening){try{recog.stop()}catch(e){} listening=false;document.getElementById('zikbtn').textContent='🎤 BACA SENDIRI';return}
 if(micStarting)return;
 micStarting=true;
 try{
  // Minta izin mikrofon secara terus selepas sentuhan pengguna
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
   micStream=await navigator.mediaDevices.getUserMedia({audio:true});
   micStream.getTracks().forEach(t=>t.stop());
   micStream=null;
  }
  recog=new SR();
  recog.lang='ms-MY';
  recog.continuous=true;
  recog.interimResults=false;
  recog.maxAlternatives=3;
  recog.onstart=()=>{listening=true;micStarting=false;document.getElementById('zikbtn').textContent='🔴 MIC AKTIF — BERHENTI'};
  recog.onerror=(e)=>{
   listening=false;micStarting=false;
   document.getElementById('zikbtn').textContent='🎤 BACA SENDIRI';
   let msg=e.error==='not-allowed'||e.error==='service-not-allowed'?'Benarkan akses mikrofon pada Chrome.':e.error==='no-speech'?'Suara tidak dikesan. Cuba baca lebih jelas.':'Mic: '+e.error;
   toast(msg);
  };
  recog.onend=()=>{listening=false;micStarting=false;if(ready&&z<20)document.getElementById('zikbtn').textContent='🎤 BACA SENDIRI'};
  recog.onresult=(ev)=>{
   for(let i=ev.resultIndex;i<ev.results.length;i++){
    if(!ev.results[i].isFinal)continue;
    let phrase=ev.results[i][0].transcript.toLowerCase().replace(/[.,!?]/g,' ').trim();
    // Satu sebutan yang dikenal = satu kiraan, elak kira teks interim berulang
    if(/subhanallah|subhan allah|سبحان الله/.test(phrase)&&Date.now()-lastPhraseAt>450){
     lastPhraseAt=Date.now();z=Math.min(20,z+1);
     document.getElementById('count').textContent=z+' / 20';
     document.getElementById('ropefill').style.width=(z*5)+'%';
     document.getElementById('pullhint').textContent='Suara dikesan — tali bergerak';
     if(z>=20){
      document.getElementById('zikbtn').disabled=true;
      document.getElementById('mzikir').textContent='☑ Subhanallah 20×';
      try{recog.stop()}catch(e){}
      listening=false;
      setTimeout(reveal,500);
      return;
     }
    }
   }
  };
  recog.start();
 }catch(e){
  micStarting=false;listening=false;
  document.getElementById('zikbtn').textContent='🎤 BACA SENDIRI';
  toast('Mic tidak dapat dibuka. Semak izin mikrofon Chrome.');
  console.log('Mic error:',e);
 }
}
function reveal(){pull=false;ready=false;shot=false;found.add(target[1]);score+=target[2];if(score<0)score=0;level=1+Math.floor(score/500);ui();document.getElementById('mresult').textContent='☑ Dapatkan hasil';document.getElementById('itememoji').textContent=target[0];document.getElementById('itemname').textContent=target[1];document.getElementById('itemdesc').textContent=target[2]>=0?'Hasil yang baik! Mata bertambah.':'Barang buruk! Mata dipotong.';document.getElementById('itempoints').textContent=(target[2]>=0?'+':'')+target[2]+' mata';document.getElementById('result').style.display='block';document.getElementById('zikbtn').disabled=true;document.getElementById('pullhint').textContent='Panah sasaran baharu';document.getElementById('ropefill').style.width='0%';document.getElementById('count').textContent='0 / 20';document.getElementById('mzikir').textContent='☐ Subhanallah 20×';document.getElementById('mresult').textContent='☐ Dapatkan hasil';z=0;initAudio();successSound();speakResult(target)}
function closeResult(){document.getElementById('result').style.display='none';target=null;z=0;document.getElementById('count').textContent='0 / 20';document.getElementById('ropefill').style.width='0%';document.getElementById('zikbtn').disabled=true;if('speechSynthesis'in window)speechSynthesis.cancel();voiceBusy=false}
function openShop(){document.getElementById('shopscore').textContent=score;let list=document.getElementById('shopitems');list.innerHTML='';upgrades.forEach((u,i)=>{let owned=i<=currentUpgrade;let row=document.createElement('div');row.className='shoprow';row.innerHTML=`<div><b>${u.name}</b><div class="small">Jarak panahan ×${u.dist}</div></div><button ${owned?'disabled':''}>${owned?'DIMILIKI':'💰 '+u.cost}</button>`;let b=row.querySelector('button');b.onclick=()=>{if(score<u.cost){toast('Mata tidak cukup!');return}score-=u.cost;currentUpgrade=i;distance=u.dist;ui();openShop();toast('Upgrade berjaya! Jarak panahan meningkat.')};list.appendChild(row)});document.getElementById('shop').style.display='block'}
function closeShop(){document.getElementById('shop').style.display='none'}
/* Underwater art: dense random objects and gently moving marine life */
let bubbles=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*4,v:.25+Math.random()*1.2}));
let fish=Array.from({length:58},()=>({x:Math.random()*W,y:Math.random()*H*.78,homeX:Math.random()*W,homeY:Math.random()*H*.78,s:.16+Math.random()*.34,dir:Math.random()<.5?-1:1,alpha:.18+Math.random()*.25,phase:Math.random()*6.28}));
let debris=Array.from({length:260},()=>({x:Math.random()*W,y:H*.12+Math.random()*H*.82,kind:Math.floor(Math.random()*items.length),alpha:.20+Math.random()*.22,scale:.34+Math.random()*.68}));
let time=0;
function draw(){requestAnimationFrame(draw);time+=.01;if(powerDown)power=Math.min(100,power+.8);document.getElementById("powerLabel").textContent=Math.round(power)+"%";document.getElementById("powerBox").style.setProperty("--p",power);ctx.clearRect(0,0,W,H);
let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#087f9c');grad.addColorStop(.4,'#07546c');grad.addColorStop(1,'#071e1c');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
// light rays
for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(W*(.15+i*.12),0);ctx.lineTo(W*(.05+i*.15),H*.72);ctx.lineTo(W*(.12+i*.14),H*.72);ctx.closePath();ctx.fillStyle='rgba(170,240,255,.035)';ctx.fill()}
// sea bed
ctx.fillStyle='#122f26';ctx.beginPath();ctx.moveTo(0,H*.72);for(let x=0;x<W;x+=30)ctx.lineTo(x,H*.72+Math.sin(x*.012+time)*25+Math.random()*3);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
for(let d of debris){let item=items[d.kind];ctx.globalAlpha=d.alpha;ctx.font=(20*d.scale)+'px serif';ctx.fillText(item[0],((d.x-viewX*W*1.7)%W+W)%W,((d.y-viewY*H*1.2)%H+H)%H);ctx.globalAlpha=1}
fish.forEach(f=>{f.phase+=.003;f.x=f.homeX+Math.sin(f.phase)*7;f.y=f.homeY+Math.cos(f.phase*.7)*4;ctx.globalAlpha=f.alpha;ctx.font=(22*f.s)+'px serif';ctx.fillText(['🐟','🐠','🦈','🐙','🦑','🦐','🦀','🐢','🪼'][Math.floor(f.homeX/37+f.homeY/53)%9],f.x-viewX*W*.8,f.y-viewY*H*.8);ctx.globalAlpha=1});
bubbles.forEach(b=>{b.y-=b.v;if(b.y<0)b.y=H+5;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.strokeStyle='rgba(180,245,255,.3)';ctx.stroke()});
// reticle
ctx.strokeStyle='#ffe25d';ctx.lineWidth=2;let cx=W*(.5+aimX*.18-viewX*.5),cy=H*(.42-viewY*.5);ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);ctx.moveTo(cx-34,cy);ctx.lineTo(cx-12,cy);ctx.moveTo(cx+12,cy);ctx.lineTo(cx+34,cy);ctx.moveTo(cx,cy-34);ctx.lineTo(cx,cy-12);ctx.moveTo(cx,cy+12);ctx.lineTo(cx,cy+34);ctx.stroke();
// compact realistic fishing speargun centered in first-person view
ctx.save();ctx.translate(W*.5,H*.94);ctx.scale(.68,.68);
// dark barrel and stock
ctx.fillStyle='#172630';ctx.beginPath();ctx.moveTo(-17,54);ctx.lineTo(-11,-90);ctx.lineTo(11,-90);ctx.lineTo(17,54);ctx.closePath();ctx.fill();
ctx.fillStyle='#246b8d';ctx.fillRect(-14,-35,28,13);ctx.fillRect(-16,26,32,12);
// barrel rail
ctx.strokeStyle='#c9d4dc';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-78);ctx.lineTo(0,-160);ctx.stroke();
// bow arms / rubber bands
ctx.strokeStyle='#d7ad4b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-12,-72);ctx.quadraticCurveTo(-36,-45,-38,8);ctx.moveTo(12,-72);ctx.quadraticCurveTo(36,-45,38,8);ctx.stroke();
// metal bow tips and muzzle
ctx.fillStyle='#aab9c5';ctx.fillRect(-17,-77,8,10);ctx.fillRect(9,-77,8,10);
// grip
ctx.fillStyle='#111a22';ctx.beginPath();ctx.moveTo(9,8);ctx.lineTo(28,8);ctx.lineTo(34,54);ctx.lineTo(19,58);ctx.closePath();ctx.fill();
// reel and gold line
ctx.fillStyle='#263b4a';ctx.beginPath();ctx.arc(29,22,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d9b75a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(29,22,11,0,Math.PI*2);ctx.stroke();
// spear resting in barrel, pointed tip
ctx.strokeStyle='#dbe5ed';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-80);ctx.lineTo(0,-164);ctx.stroke();ctx.fillStyle='#e4edf4';ctx.beginPath();ctx.moveTo(0,-177);ctx.lineTo(-8,-160);ctx.lineTo(0,-164);ctx.lineTo(8,-160);ctx.closePath();ctx.fill();
ctx.restore();
// arrow flight visual
if(flight){flight.progress=Math.min(1,flight.progress+flight.speed);let t=flight.progress;let fx=flight.x+(flight.tx-flight.x)*t,fy=flight.y+(flight.ty-flight.y)*t;ctx.save();ctx.translate(fx,fy);ctx.rotate(Math.atan2(flight.ty-flight.y,flight.tx-flight.x)+Math.PI/2);ctx.strokeStyle='#dce8f0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(0,-24);ctx.stroke();ctx.fillStyle='#dce8f0';ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(-6,-18);ctx.lineTo(6,-18);ctx.fill();ctx.restore();if(t>=1){flight=null;shot=true;hitSound();/* Objek kekal misteri sehingga ditarik. */}}
// Tali lurus dari hujung alat panah ke sasaran; memendek lurus semasa ditarik
if(pull&&target){const sx=W*.5,sy=H*.77,tx=W*.5+aimX*W*.2,ty=H*.42;const remain=Math.max(0,1-z/20);const ex=sx+(tx-sx)*remain,ey=sy+(ty-sy)*remain;ctx.save();ctx.strokeStyle='#f1c56c';ctx.lineWidth=2.5;ctx.shadowColor='#ffe18a';ctx.shadowBlur=5;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.restore();}
// Jangan dedahkan objek selepas terkena panah — kekalkan misteri sehingga hasil ditarik
if(shot&&target){ctx.globalAlpha=0.25;ctx.font="30px serif";ctx.textAlign="center";ctx.fillText('❔',cx,cy-52);ctx.textAlign="start";ctx.globalAlpha=1;}
// fish target glow after shot
if(shot){ctx.beginPath();ctx.arc(cx,cy,42+Math.sin(time*4)*4,0,Math.PI*2);ctx.strokeStyle='#ffdd5a';ctx.lineWidth=3;ctx.stroke()}
}
draw();
</script>
